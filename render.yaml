# Blueprint Render : l'API (service web) et le frontend (site statique, jamais endormi).
services:
  - type: web
    name: kim-api
    runtime: node
    rootDir: backend
    # Offre gratuite : l'API s'endort après ~15 min (premier message jusqu'à 30 s). Avant l'ouverture au public : passer à une offre
    # payante (plan: starter), ou garder .github/workflows/keepalive.yml actif.
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - { key: NODE_VERSION, value: 20 }
      - { key: DATABASE_URL, sync: false }
      - { key: GEMINI_API_KEY, sync: false }
      - { key: GEMINI_MODEL, value: gemini-2.5-flash }
      - { key: CLOUDINARY_CLOUD_NAME, sync: false }
      - { key: CLOUDINARY_API_KEY, sync: false }
      - { key: CLOUDINARY_API_SECRET, sync: false }
      - { key: JWT_SECRET, generateValue: true }
      - { key: ADMIN_FULL_NAME, value: Administrateur }
      - { key: ADMIN_EMAIL, sync: false }
      - { key: ADMIN_PASSWORD, sync: false }
      # Connexion avec Google (facultative) et mode évaluation (facultatif)
      - { key: GOOGLE_CLIENT_ID, sync: false }
      # E-mails de compte (mot de passe oublié, vérification) : API Resend
      - { key: MAIL_API_KEY, sync: false }
      - { key: MAIL_FROM, sync: false }
      - { key: PUBLIC_SITE_URL, sync: false }
      - { key: EVAL_API_KEY, sync: false }
      # URL du site statique, ex. https://kim-web.onrender.com (plusieurs valeurs séparées par des virgules ; « * » = toutes)
      - { key: FRONTEND_URL, sync: false }

  - type: web
    name: kim-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # Règle de réécriture déclarée ici : plus rien à ajouter à la main dans « Redirects/Rewrites ».
    routes:
      - { type: rewrite, source: /*, destination: /index.html }
    headers:
      - { path: /sw.js, name: Cache-Control, value: no-cache }
      - { path: /index.html, name: Cache-Control, value: no-cache }
      # Fichiers à empreinte (Vite) et images : cache longue durée (meilleure vitesse, donc meilleur classement)
      - { path: /assets/*, name: Cache-Control, value: "public, max-age=31536000, immutable" }
      - { path: /backgrounds/*, name: Cache-Control, value: "public, max-age=2592000" }
      - { path: /icons/*, name: Cache-Control, value: "public, max-age=2592000" }
      - { path: /og-image.jpg, name: Cache-Control, value: "public, max-age=86400" }
      - { path: /sitemap.xml, name: Cache-Control, value: "public, max-age=3600" }
      # Sécurité (signal de confiance, et protection des visiteurs)
      - { path: /*, name: X-Content-Type-Options, value: nosniff }
      - { path: /*, name: Referrer-Policy, value: strict-origin-when-cross-origin }
      - { path: /*, name: X-Frame-Options, value: SAMEORIGIN }
    envVars:
      - { key: NODE_VERSION, value: 20 }
      # URL de l'API incluant /api/v1, ex. https://kim-api.onrender.com/api/v1
      - { key: VITE_API_URL, sync: false }
      # Référencement : adresse publique du site (sans slash final), ex. https://kim-web.onrender.com ou votre nom de domaine
      - { key: VITE_SITE_URL, sync: false }
      # Codes de vérification de propriété (Google Search Console / Bing Webmaster Tools), facultatifs
      - { key: VITE_GOOGLE_SITE_VERIFICATION, sync: false }
      - { key: VITE_BING_SITE_VERIFICATION, sync: false }
