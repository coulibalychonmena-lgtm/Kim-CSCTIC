# Garde l'API Render « éveillée » (offre gratuite : mise en veille après ~15 min d'inactivité, premier message jusqu'à 30 s).
# GitHub exécute ce travail environ toutes les 10 minutes (pas de garantie à la minute près). Variable du dépôt : KIM_API_HEALTH_URL
# (par ex. https://kim-api.onrender.com/api/v1/health). La vraie solution avant l'ouverture au public : passer l'API sur une offre Render payante.
name: Garder Kim éveillé
on:
  schedule:
    - cron: '*/10 5-21 * * *'   # de 5 h à 21 h UTC (heure d'Abidjan = UTC)
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Réveiller l'API
        env:
          URL: ${{ vars.KIM_API_HEALTH_URL }}
        run: |
          if [ -z "$URL" ]; then echo "Variable KIM_API_HEALTH_URL absente : rien à faire."; exit 0; fi
          curl --fail --silent --show-error --max-time 60 --retry 2 "$URL" && echo " OK"
